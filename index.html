<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>❤️ Birtaneme ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

background:
linear-gradient(135deg,#120014,#240028,#120014);

overflow:hidden;

height:100vh;

color:white;

}

canvas{

position:fixed;

top:0;

left:0;

width:100%;

height:100%;

pointer-events:none;

}

#hearts{

position:fixed;

width:100%;

height:100%;

overflow:hidden;

z-index:-1;

}

.heart{

position:absolute;

color:#ff4d7d;

font-size:25px;

animation:float 8s linear infinite;

opacity:.8;

}

@keyframes float{

0%{

transform:translateY(100vh) scale(.4);

opacity:0;

}

30%{

opacity:1;

}

100%{

transform:translateY(-120vh) scale(1.2);

opacity:0;

}

}

#main{

position:absolute;

top:50%;

left:50%;

transform:translate(-50%,-50%);

width:90%;

max-width:700px;

padding:40px;

border-radius:35px;

background:rgba(255,255,255,.08);

backdrop-filter:blur(18px);

box-shadow:

0 0 40px rgba(255,0,90,.3),

0 0 90px rgba(255,0,120,.15);

text-align:center;

transition:1s;

}

h1{

font-size:48px;

margin-bottom:20px;

text-shadow:0 0 20px hotpink;

animation:beat 1.5s infinite;

}

@keyframes beat{

50%{

transform:scale(1.05);

}

}

#subtitle{

font-size:22px;

opacity:.9;

margin-bottom:35px;

}

button{

padding:18px 45px;

font-size:22px;

border:none;

border-radius:60px;

cursor:pointer;

background:linear-gradient(45deg,#ff2d75,#ff6ea7);

color:white;

box-shadow:0 0 25px #ff2d75;

transition:.35s;

}

button:hover{

transform:scale(1.08);

box-shadow:0 0 40px #ff4d7d;

}

button:active{

transform:scale(.92);

}

#messageScreen{

display:none;

opacity:0;

transition:1s;

}

#text{

font-size:24px;

line-height:1.9;

white-space:pre-line;

margin-top:20px;

}

#buttons{

display:none;

margin-top:35px;

}

#yes{

margin-right:20px;

}

#no{

position:absolute;

}

.photo{

width:180px;

height:180px;

object-fit:cover;

border-radius:25px;

margin:12px;

box-shadow:0 0 25px hotpink;

opacity:0;

transform:scale(.7);

transition:1s;

}

#gallery{

display:none;

margin-top:40px;

}

.finalTitle{

font-size:65px;

color:#ff6ea7;

text-shadow:0 0 30px hotpink;

animation:beat 1s infinite;

}

</style>

</head>

<body>

<div id="hearts"></div>

<canvas id="fx"></canvas>

<div id="main">

<div id="start">

<h1>❤️ Birtanem ❤️</h1>

<p id="subtitle">

Sana söylemek istediğim çok önemli bir şey var...

</p>

<button onclick="startStory(event)">

Buraya Tıkla ❤️

</button>

</div>

<div id="messageScreen">

<h1>❤️ Birtanem ❤️</h1>

<div id="text"></div>

<div id="buttons">

<button id="yes" onclick="acceptLove(event)">

Evet ❤️

</button>

<button id="no">

Hayır 🙈

</button>

</div>

<div id="gallery">

<!-- FOTOĞRAFLAR BURAYA GELECEK -->

</div>

</div>

</div>

<script>const message = `Birtanem,

Biliyorum yapmamam gereken bir hatayı yaptım.

Dediğim gibi sözlerim gözünde pek bir işe yarayacağını sanmıyorum.

Davranışlarımla olacağına inanıyorum bunun için elimden geleni yapacağım.

Seni çoookkkk seviyorum sevgilim.

İyiki benimsin. ❤️

- Birtanen ❤️`;

const text = document.getElementById("text");
const messageScreen = document.getElementById("messageScreen");
const start = document.getElementById("start");
const buttons = document.getElementById("buttons");

function createHeart(){

const heart=document.createElement("div");

heart.className="heart";

heart.innerHTML="❤️";

heart.style.left=Math.random()*100+"vw";

heart.style.animationDuration=(6+Math.random()*5)+"s";

heart.style.fontSize=(18+Math.random()*30)+"px";

document.getElementById("hearts").appendChild(heart);

setTimeout(()=>{

heart.remove();

},11000);

}

setInterval(createHeart,180);

function burst(x,y){

for(let i=0;i<70;i++){

const h=document.createElement("div");

h.innerHTML="❤️";

h.style.position="fixed";

h.style.left=x+"px";

h.style.top=y+"px";

h.style.pointerEvents="none";

h.style.fontSize=(16+Math.random()*18)+"px";

document.body.appendChild(h);

let angle=Math.random()*Math.PI*2;

let distance=120+Math.random()*220;

h.animate([

{

transform:"translate(0,0) scale(1)",

opacity:1

},

{

transform:`translate(${Math.cos(angle)*distance}px,${Math.sin(angle)*distance}px) rotate(${Math.random()*720}deg) scale(0)`,

opacity:0

}

],{

duration:1200,

easing:"ease-out"

});

setTimeout(()=>{

h.remove();

},1200);

}

}

function startStory(e){

burst(e.clientX,e.clientY);

setTimeout(()=>{

start.style.display="none";

messageScreen.style.display="block";

setTimeout(()=>{

messageScreen.style.opacity=1;

},50);

typeWriter();

},700);

}

function typeWriter(){

let i=0;

const speed=38;

function type(){

if(i<message.length){

text.innerHTML+=message.charAt(i);

i++;

setTimeout(type,speed);

}else{

buttons.style.display="block";

}

}

type();

}

const no=document.getElementById("no");

document.addEventListener("mousemove",()=>{

if(buttons.style.display=="block"){

no.style.left=Math.random()*(window.innerWidth-150)+"px";

no.style.top=Math.random()*(window.innerHeight-80)+"px";

}

});function createConfetti(){

for(let i=0;i<120;i++){

const c=document.createElement("div");

c.innerHTML=Math.random()>0.5?"❤️":"✨";

c.style.position="fixed";

c.style.left=Math.random()*window.innerWidth+"px";

c.style.top="-30px";

c.style.fontSize=(16+Math.random()*24)+"px";

c.style.pointerEvents="none";

document.body.appendChild(c);

let duration=2500+Math.random()*2000;

c.animate([

{

transform:"translateY(0) rotate(0deg)",

opacity:1

},

{

transform:`translateY(${window.innerHeight+100}px) rotate(${Math.random()*900}deg)`,

opacity:0

}

],{

duration:duration,

easing:"linear"

});

setTimeout(()=>{

c.remove();

},duration);

}

}

function flash(){

const f=document.createElement("div");

f.style.position="fixed";

f.style.left="0";

f.style.top="0";

f.style.width="100%";

f.style.height="100%";

f.style.background="white";

f.style.opacity=".9";

f.style.pointerEvents="none";

document.body.appendChild(f);

f.animate([

{opacity:.9},

{opacity:0}

],{

duration:500

});

setTimeout(()=>{

f.remove();

},500);

}

function acceptLove(e){

burst(e.clientX,e.clientY);

flash();

createConfetti();

setTimeout(()=>{

document.body.innerHTML=`

<div style="

display:flex;

justify-content:center;

align-items:center;

flex-direction:column;

height:100vh;

background:

radial-gradient(circle,#3d0020,#120014,#000);

overflow:hidden;

color:white;

text-align:center;

">

<h1 style="

font-size:80px;

color:#ff6ea7;

animation:beat 1s infinite;

text-shadow:0 0 35px hotpink;

">

❤️ HER ŞEYİMSİN ❤️

</h1>

<h2 style="margin-top:30px;font-size:32px;">

❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️

</h2>

<h2 style="font-size:32px;margin-top:15px;">

SENİ ÇOOOOKKKK SEVİYORUM

</h2>

<h2 style="margin-top:15px;font-size:32px;">

❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️

</h2>

<div id="photoGallery"

style="

display:flex;

flex-wrap:wrap;

justify-content:center;

margin-top:40px;

">

</div>

</div>

`;

createConfetti();

},900);

}// FOTOĞRAFLAR
setTimeout(() => {

const gallery = document.getElementById("photoGallery");

if(gallery){

gallery.innerHTML=`

<img src="foto1.jpg" class="photo">
<img src="foto2.jpg" class="photo">
<img src="foto3.jpg" class="photo">
<img src="foto4.jpg" class="photo">

`;

const photos=document.querySelectorAll(".photo");

photos.forEach((p,i)=>{

setTimeout(()=>{

p.style.opacity="1";
p.style.transform="scale(1)";

},i*800);

});

}

},1500);


// GÜL YAPRAKLARI

function createRose(){

const rose=document.createElement("div");

rose.innerHTML="🌹";

rose.style.position="fixed";

rose.style.left=Math.random()*100+"vw";

rose.style.top="-40px";

rose.style.fontSize=(20+Math.random()*25)+"px";

rose.style.pointerEvents="none";

document.body.appendChild(rose);

rose.animate([

{
transform:"translateY(0px) rotate(0deg)",
opacity:1
},

{
transform:`translateY(${window.innerHeight+100}px) rotate(${Math.random()*720}deg)`,
opacity:0
}

],{

duration:7000+Math.random()*3000,

easing:"linear"

});

setTimeout(()=>{

rose.remove();

},10000);

}

setInterval(createRose,700);


// PARILTILAR

function sparkle(){

const s=document.createElement("div");

s.innerHTML="✨";

s.style.position="fixed";

s.style.left=Math.random()*100+"vw";

s.style.top=Math.random()*100+"vh";

s.style.fontSize=(10+Math.random()*15)+"px";

document.body.appendChild(s);

s.animate([

{opacity:0},

{opacity:1},

{opacity:0}

],{

duration:1500

});

setTimeout(()=>{

s.remove();

},1500);

}

setInterval(sparkle,250);


// DOSYA SONU

</script>

</body>

</html>
